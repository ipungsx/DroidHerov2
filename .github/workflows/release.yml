name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: false
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Godot 4.7.2 & Export Templates
        run: |
          mkdir -p /tmp/dh_tools ~/.local/share/godot/export_templates/4.7.2.stable /tmp/dh_tpl
          curl -fsSL -o /tmp/dh_tools/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -oq /tmp/dh_tools/godot.zip -d /tmp/dh_tools
          chmod +x /tmp/dh_tools/Godot_v4.7.2-stable_linux.x86_64

          curl -fsSL -o /tmp/dh_tools/tpl.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -oq /tmp/dh_tools/tpl.tpz -d /tmp/dh_tpl
          mv /tmp/dh_tpl/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rm -rf /tmp/dh_tpl /tmp/dh_tools/tpl.tpz

      - name: Configure Android SDK & Keystore
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          mkdir -p ~/.android ~/.config/godot
          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 \
            -deststoretype pkcs12

          cat <<EOF > ~/.config/godot/editor_settings-4.7.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${SDK_DIR}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Build DroidHeroV2.apk
        run: |
          mkdir -p /tmp/dh_out
          /tmp/dh_tools/Godot_v4.7.2-stable_linux.x86_64 --headless --import || true
          /tmp/dh_tools/Godot_v4.7.2-stable_linux.x86_64 --headless --export-debug "Android" /tmp/dh_out/DroidHeroV2.apk
          ls -lh /tmp/dh_out/DroidHeroV2.apk

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TARGET_TAG="${GITHUB_REF_NAME}"
          else
            TARGET_TAG="${INPUT_TAG:-v2.0.0}"
          fi
          gh release upload "${TARGET_TAG}" /tmp/dh_out/DroidHeroV2.apk --clobber
